# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
reviews:
  profile: "assertive"
  high_level_summary: true
  review_status: true
  path_filters:
    - "!**/walkthroughs/**"
    - "!**/SequenceDiagram*"
    - "!**/*.png"
    - "!**/*.svg"
  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords:
      - "wip"
      - "draft"
    base_branches: [".*"]
